spring.application.name=api
server.port=7010
spring.datasource.url=jdbc:postgresql://localhost:5432/task&habits

spring.datasource.username=postgres
spring.datasource.password=123

# Hibernate nastavenia (automaticke vytvaranie a uprava tabuliek)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT kluc (Base64, min. 32 bajtov) sa berie z premennej prostredia JWT_SECRET.
# Ak nie je nastaveny, backend si pri starte vygeneruje nahodny kluc (vhodne na lokalny vyvoj).
jwt.secret=${JWT_SECRET:}

spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH
spring.web.cors.allowed-headers=*